name: Update federal contracts

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: federal-contract-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install headless browser
        run: python -m playwright install --with-deps chromium
      - name: Collect and process awards
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: python scripts/update.py
      - name: Validate generated data
        run: python scripts/validate_data.py
      - name: Run tests
        run: python -m pytest
      - name: Commit data changes
        run: |
          git config user.name "moco-contract-bot"
          git config user.email "moco-contract-bot@users.noreply.github.com"
          git add data/contracts.json data/contracts.csv data/latest.json data/companies.json data/metadata.json data/company_contacts.json data/production_report.json data/company_candidates.csv data/war_processed.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily federal contract update"
            git push
          fi
